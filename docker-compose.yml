version: '3.8'

services:
  ros2-unikraft-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ros2-unikraft-dev
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: /bin/bash -c "source /opt/ros/humble/setup.bash && /bin/bash"
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    network_mode: host

  # Additional service for testing with CycloneDDS
  ros2-cyclonedds:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ros2-cyclonedds
    privileged: true
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///workspace/config/cyclonedds.xml
    network_mode: host
